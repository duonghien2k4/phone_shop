<!DOCTYPE html>

<html class="h-full bg-surface" lang="vi">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Đăng nhập Quản trị viên - Sóc Mobile Admin Console v2.5</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f8f9ff",
            "surface-container": "#e5eeff",
            "background": "#f8f9ff",
            "on-background": "#0b1c30",
            "primary-container": "#2563eb",
            "surface-variant": "#d3e4fe",
            "on-primary-fixed": "#00174b",
            "error-container": "#ffdad6",
            "outline-variant": "#c3c6d7",
            "outline": "#737686",
            "on-tertiary": "#ffffff",
            "primary-fixed": "#dbe1ff",
            "surface-tint": "#0053db",
            "tertiary-fixed-dim": "#62df7d",
            "on-error": "#ffffff",
            "on-tertiary-fixed": "#002109",
            "primary-fixed-dim": "#b4c5ff",
            "secondary-fixed-dim": "#bec6e0",
            "surface-container-high": "#dce9ff",
            "secondary-fixed": "#dae2fd",
            "primary": "#004ac6",
            "tertiary-container": "#007f36",
            "secondary": "#565e74",
            "on-error-container": "#93000a",
            "error": "#ba1a1a",
            "inverse-primary": "#b4c5ff",
            "surface-container-lowest": "#ffffff",
            "surface-dim": "#cbdbf5",
            "surface-bright": "#f8f9ff",
            "tertiary-fixed": "#7ffc97",
            "on-tertiary-container": "#c7ffca",
            "surface-container-highest": "#d3e4fe",
            "on-primary-container": "#eeefff",
            "on-secondary-container": "#5c647a",
            "on-surface-variant": "#434655",
            "inverse-surface": "#213145",
            "tertiary": "#006329",
            "on-secondary": "#ffffff",
            "secondary-container": "#dae2fd",
            "on-tertiary-fixed-variant": "#005320",
            "on-secondary-fixed-variant": "#3f465c",
            "on-primary-fixed-variant": "#003ea8",
            "on-primary": "#ffffff",
            "surface-container-low": "#eff4ff",
            "inverse-on-surface": "#eaf1ff"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "gutter-desktop": "1.5rem",
            "margin-desktop": "2rem",
            "space-lg": "1.5rem",
            "space-md": "0.75rem",
            "space-2xs": "0.125rem",
            "space-2xl": "3rem",
            "gutter": "1rem",
            "space-sm": "0.5rem",
            "space-base": "1rem",
            "margin": "1rem",
            "space-xs": "0.25rem",
            "space-xl": "2rem"
          },
          fontFamily: {
            "data-tabular": ["Inter"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-lg": ["Inter"],
            "headline-xl": ["Plus Jakarta Sans"],
            "label-lg": ["Inter"],
            "body-base": ["Inter"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-base": ["Inter"],
            "label-sm": ["Inter"],
            "body-sm": ["Inter"]
          },
          fontSize: {
            "data-tabular": ["0.875rem", { lineHeight: "1.25rem", fontWeight: "500" }],
            "headline-md": ["1.25rem", { lineHeight: "1.75rem", letterSpacing: "-0.015em", fontWeight: "600" }],
            "headline-sm": ["1rem", { lineHeight: "1.5rem", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-lg": ["1rem", { lineHeight: "1.5rem", fontWeight: "400" }],
            "headline-xl": ["1.875rem", { lineHeight: "2.25rem", letterSpacing: "-0.025em", fontWeight: "700" }],
            "label-lg": ["0.875rem", { lineHeight: "1.25rem", fontWeight: "600" }],
            "body-base": ["0.875rem", { lineHeight: "1.25rem", fontWeight: "400" }],
            "headline-lg": ["1.5rem", { lineHeight: "2rem", letterSpacing: "-0.02em", fontWeight: "600" }],
            "label-base": ["0.8125rem", { lineHeight: "1.125rem", fontWeight: "500" }],
            "label-sm": ["0.6875rem", { lineHeight: "0.875rem", letterSpacing: "0.025em", fontWeight: "600" }],
            "body-sm": ["0.75rem", { lineHeight: "1rem", fontWeight: "400" }]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      font-size: 1.25rem;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }

    .grid-mesh {
      background-size: 32px 32px;
      background-image:
        linear-gradient(to right, rgba(195, 198, 215, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(195, 198, 215, 0.15) 1px, transparent 1px);
    }
  </style>
</head>

<body
  class="min-h-screen bg-surface-container-low font-body-base text-on-surface antialiased flex items-center justify-center p-4 selection:bg-primary-fixed selection:text-on-primary-fixed relative overflow-hidden grid-mesh">
  <!-- Top Announcement Bar / High Security Environment Notice -->
  <!-- Main Canvas: Dual Column Enterprise Workstation Layout -->
  <main class="w-full max-w-[420px] mx-auto py-8 relative z-10 flex flex-col items-center">
    <!-- Minimalist Centered Card -->
    <div
      class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded-xl shadow-sm p-6 sm:p-8 space-y-6">
      <!-- Card Header / Brand -->
      <div class="text-center space-y-2">
        <div
          class="inline-flex items-center justify-center w-11 h-11 rounded-lg bg-primary text-on-primary shadow-sm mb-1">
          <span class="material-symbols-outlined text-[24px]">devices</span>
        </div>
        <div class="flex items-center justify-center gap-1.5">
          <h1 class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">Đăng nhập Quản trị</h1>
        </div>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Nhập tài khoản nội bộ để truy cập Sóc Mobile Console
        </p>
      </div>
      <!-- Login Form -->
      <form class="space-y-4" onsubmit="event.preventDefault();">
        <!-- Input: Email / Staff ID -->
        <div class="space-y-1.5">
          <label class="block font-label-base text-label-base font-medium text-on-surface" for="user-identifier">
            Email hoặc Mã nhân viên
          </label>
          <input
            class="block w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant/80 text-on-surface placeholder:text-outline text-body-base font-body-base rounded-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none"
            id="user-identifier" name="user-identifier" placeholder="admin@socmobile.vn" required="" type="text"
            value="admin@socmobile.vn" />
        </div>
        <!-- Input: Password -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block font-label-base text-label-base font-medium text-on-surface" for="user-password">
              Mật khẩu
            </label>
            <button
              class="text-primary hover:text-primary-container font-label-sm text-label-sm hover:underline transition-colors"
              type="button">
              Quên mật khẩu?
            </button>
          </div>
          <div class="relative rounded-md">
            <input
              class="block w-full h-10 pl-3 pr-10 bg-surface-container-lowest border border-outline-variant/80 text-on-surface placeholder:text-outline text-body-base font-body-base rounded-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none"
              id="user-password" name="user-password" placeholder="Nhập mật khẩu" required="" type="password"
              value="••••••••••••" />
            <button aria-label="Ẩn/hiện mật khẩu"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none"
              type="button">
              <span class="material-symbols-outlined text-[18px]">visibility</span>
            </button>
          </div>
        </div>
        <!-- Remember Me -->
        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input checked=""
              class="h-4 w-4 rounded border-outline-variant text-primary-container focus:ring-primary-container/20 cursor-pointer"
              type="checkbox" />
            <span class="font-body-sm text-body-sm text-on-surface-variant font-normal">
              Ghi nhớ đăng nhập
            </span>
          </label>
        </div>
        <!-- Submit Button -->
        <div class="pt-1">
          <button
            class="w-full h-10 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-medium rounded-md shadow-sm transition-all duration-150 flex items-center justify-center gap-2 focus:ring-2 focus:ring-primary-container/40 focus:outline-none cursor-pointer"
            type="submit">
            <span>Đăng nhập</span>
          </button>
        </div>
      </form>
      <!-- Divider -->
      <div class="relative flex items-center py-1">
        <div class="flex-grow border-t border-outline-variant/60"></div>
        <span class="flex-shrink mx-3 font-label-sm text-label-sm uppercase tracking-wider text-outline text-[11px]">
          Hoặc
        </span>
        <div class="flex-grow border-t border-outline-variant/60"></div>
      </div>
      <!-- Alternative Options -->
      <div class="space-y-2.5">
        <button
          class="w-full h-10 px-3 bg-surface-container-lowest hover:bg-surface-container-low border border-outline-variant/80 text-on-surface font-label-base text-label-base rounded-md shadow-sm transition-colors flex items-center justify-center gap-2"
          type="button">
          <span class="material-symbols-outlined text-[18px] text-[#EA4335]">domain</span>
          <span>Tiếp tục với Google Workspace</span>
        </button>
        <button
          class="w-full h-10 px-3 bg-surface-container-lowest hover:bg-surface-container-low border border-outline-variant/80 text-on-surface font-label-base text-label-base rounded-md shadow-sm transition-colors flex items-center justify-center gap-2"
          type="button">
          <span class="material-symbols-outlined text-[18px] text-primary">fingerprint</span>
          <span>Đăng nhập bằng Passkey / FIDO2</span>
        </button>
      </div>
    </div>
    <!-- Subtle Sub-card Security Notice -->
    <div class="mt-6 text-center text-on-surface-variant text-[12px] font-body-sm space-y-1">
      <p>© 2025 Sóc Mobile Vietnam • Bảo mật hệ thống nội bộ</p>
      <p class="text-outline text-[11px]">Hỗ trợ kỹ thuật: 1800 6868</p>
    </div>
  </main>
  <!-- Global Enterprise Compliance Footer -->
</body>

</html>
